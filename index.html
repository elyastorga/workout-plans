<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mi Gym">
<meta name="theme-color" content="#f4f7f6">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Mi Gym</title>
<style>
  :root {
    --bg: #f4f7f6; --card: #ffffff; --ink: #18211f; --muted: #6b7a76; --line: #e3eae8;
    --accent: #1f9e8f; --accent-soft: #e2f4f1; --warn: #e07a2e; --ok: #2f9e55;
    --radius: 16px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1413; --card: #182120; --ink: #eef3f2; --muted: #93a39f; --line: #26312f;
            --accent: #3cc2b1; --accent-soft: #163330; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }
  body { padding: env(safe-area-inset-top) 0 calc(110px + env(safe-area-inset-bottom)); }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px; }
  header { padding: 14px 0 6px; display: flex; align-items: center; justify-content: space-between; }
  header h1 { font-size: 28px; margin: 0; letter-spacing: -0.02em; }
  header .focus { color: var(--muted); font-size: 14px; }
  .iconbtn { border: 0; background: var(--card); color: var(--ink); width: 40px; height: 40px;
    border-radius: 12px; font-size: 20px; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  .week { display: flex; align-items: center; justify-content: space-between; background: var(--card);
    border-radius: var(--radius); padding: 10px 12px; margin: 8px 0 12px; }
  .week .lbl { font-weight: 600; } .week .sub { color: var(--muted); font-size: 13px; }
  .week button { border: 0; background: var(--accent-soft); color: var(--accent); width: 36px; height: 36px;
    border-radius: 10px; font-size: 20px; font-weight: 600; }
  .tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
  .tab { border: 0; border-radius: 12px; padding: 10px 4px; background: var(--card); color: var(--ink);
    font: inherit; font-size: 14px; line-height: 1.2; }
  .tab small { display: block; color: var(--muted); font-size: 11px; margin-top: 2px; }
  .tab.on { background: var(--accent); color: #fff; } .tab.on small { color: rgba(255,255,255,.85); }
  .tab .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--ok); margin-left: 4px; vertical-align: middle; }
  .card { background: var(--card); border-radius: var(--radius); padding: 14px; margin-bottom: 10px; }
  .habits .row { display: flex; align-items: center; gap: 12px; padding: 6px 0; }
  .check { width: 28px; height: 28px; border-radius: 9px; border: 2px solid var(--line); background: transparent;
    color: #fff; font-size: 16px; flex: none; display: grid; place-items: center; }
  .check.on { background: var(--ok); border-color: var(--ok); }
  .ex h3 { margin: 0; font-size: 17px; }
  .ex .meta { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .ex .last { margin-top: 8px; font-size: 13px; color: var(--muted); }
  .badge { display: inline-block; background: #fdeee2; color: var(--warn); font-weight: 600; font-size: 12px;
    padding: 2px 8px; border-radius: 99px; margin-left: 6px; }
  @media (prefers-color-scheme: dark) { .badge { background: #3a2617; } }
  .sets { margin-top: 10px; display: grid; gap: 8px; }
  .set { display: grid; grid-template-columns: 34px 1fr 1fr 44px; gap: 8px; align-items: center; }
  .set .n { color: var(--muted); font-size: 13px; text-align: center; }
  .set input { width: 100%; font: inherit; font-size: 17px; text-align: center; padding: 10px 6px;
    border: 1.5px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); }
  .set input:focus { outline: none; border-color: var(--accent); }
  .set input::placeholder { color: var(--muted); opacity: .6; }
  .set .unit { position: relative; } .set .unit span { position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    font-size: 11px; color: var(--muted); pointer-events: none; }
  .set .check { width: 44px; height: 44px; border-radius: 12px; }
  .done-ex { opacity: .75; }
  .note { margin-top: 10px; }
  .note input { width: 100%; font: inherit; font-size: 14px; padding: 8px 10px; border: 1px dashed var(--line);
    border-radius: 10px; background: transparent; color: var(--ink); }
  .finish { width: 100%; border: 0; background: var(--accent); color: #fff; font: inherit; font-weight: 600;
    padding: 15px; border-radius: 14px; margin: 6px 0 20px; font-size: 17px; }
  .finish.done { background: var(--ok); }
  .timer { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    background: var(--card); border-top: 1px solid var(--line); }
  .timer .in { max-width: 560px; margin: 0 auto; display: flex; align-items: center; gap: 8px; }
  .timer .t { font-size: 28px; font-variant-numeric: tabular-nums; font-weight: 600; min-width: 84px; }
  .timer .t.zero { color: var(--ok); }
  .timer button { border: 0; background: var(--accent-soft); color: var(--accent); font: inherit; font-size: 14px;
    font-weight: 600; padding: 9px 10px; border-radius: 10px; }
  .timer .stop { margin-left: auto; background: transparent; color: var(--muted); }
  .sheet { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: none; z-index: 10; }
  .sheet.on { display: block; }
  .sheet .panel { position: absolute; left: 0; right: 0; bottom: 0; max-height: 85vh; overflow: auto;
    background: var(--bg); border-radius: 20px 20px 0 0; padding: 18px 16px calc(24px + env(safe-area-inset-bottom)); }
  .sheet h2 { margin: 0 0 12px; font-size: 20px; }
  .sheet .btn { display: block; width: 100%; border: 0; background: var(--card); color: var(--ink); font: inherit;
    text-align: left; padding: 14px; border-radius: 12px; margin-bottom: 8px; }
  .sheet .btn.danger { color: #c0392b; }
  .hist-item { background: var(--card); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; font-size: 14px; }
  .hist-item b { display: block; }
  .muted { color: var(--muted); font-size: 13px; }
  select { font: inherit; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); width: 100%; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 id="pname">Mi Gym</h1>
      <div class="focus" id="pfocus"></div>
    </div>
    <button class="iconbtn" id="menuBtn" aria-label="Menú">☰</button>
  </header>

  <div class="week">
    <button id="wkMinus" aria-label="Semana anterior">−</button>
    <div style="text-align:center">
      <div class="lbl" id="wkLabel">Semana 1</div>
      <div class="sub" id="wkSub"></div>
    </div>
    <button id="wkPlus" aria-label="Semana siguiente">+</button>
  </div>

  <div class="tabs" id="tabs"></div>
  <div id="day"></div>
</div>

<div class="timer">
  <div class="in">
    <div class="t" id="tVal">0:00</div>
    <button data-add="60">1:00</button>
    <button data-add="90">1:30</button>
    <button data-add="120">2:00</button>
    <button data-add="180">3:00</button>
    <button class="stop" id="tStop">✕</button>
  </div>
</div>

<div class="sheet" id="sheet"><div class="panel" id="panel"></div></div>

<script src="programs.js"></script>
<script>
const KEY = "migym.v1";
const $ = s => document.querySelector(s);
let S = load();

function load() {
  try { const d = JSON.parse(localStorage.getItem(KEY)); if (d && d.log) return d; } catch (e) {}
  return { program: "shred", week: {}, log: {}, notes: {}, day: null };
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function today() { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }
function fmtDate(iso) { const [y,m,d] = iso.split("-").map(Number); return new Date(y, m-1, d).toLocaleDateString("es-MX", { weekday: "short", day: "numeric", month: "short" }); }

const P = () => PROGRAMS[S.program];
const week = () => S.week[S.program] || 1;
const phaseIdx = () => { const w = week(); return Math.max(0, P().phases.findIndex(p => w >= p.from && w <= p.to)); };
const sessKey = (date, d) => `${date}|${S.program}|${phaseIdx()}|${d}`;

function lastSession(d, exclDate) {
  const suffix = `|${S.program}|${phaseIdx()}|${d}`;
  const dates = Object.keys(S.log).filter(k => k.endsWith(suffix)).map(k => k.split("|")[0])
    .filter(x => x < exclDate).sort();
  for (let i = dates.length - 1; i >= 0; i--) {
    const s = S.log[dates[i] + suffix];
    if (s && Object.values(s.sets || {}).some(arr => arr.some(x => x && (x.kg || x.reps)))) return { date: dates[i], s };
  }
  return null;
}

function defaultDay() {
  // Siguiente día después del último entrenamiento terminado en esta fase
  const suffixRe = new RegExp(`\\|${S.program}\\|${phaseIdx()}\\|(\\d)$`);
  let best = null;
  for (const k of Object.keys(S.log)) {
    const m = k.match(suffixRe); if (!m || !S.log[k].finished) continue;
    const date = k.split("|")[0];
    if (!best || date > best.date || (date === best.date && +m[1] > best.d)) best = { date, d: +m[1] };
  }
  if (!best) return 0;
  if (best.date === today()) return best.d;
  return (best.d + 1) % P().phases[phaseIdx()].days.length;
}

let curDay = null;

function render() {
  const p = P(), ph = p.phases[phaseIdx()];
  if (curDay === null) curDay = defaultDay();
  $("#pname").textContent = p.name;
  $("#pfocus").textContent = p.focus;
  $("#wkLabel").textContent = `Semana ${week()} de ${p.weeks}`;
  $("#wkSub").textContent = `${ph.label} · ${ph.steps} pasos diarios`;

  const t = today();
  $("#tabs").innerHTML = ph.days.map((d, i) => {
    const done = S.log[sessKey(t, i)]?.finished;
    return `<button class="tab ${i===curDay?"on":""}" data-d="${i}">${d.subtitle}${done?'<span class="dot"></span>':""}<small>${d.title}</small></button>`;
  }).join("");

  const day = ph.days[curDay];
  const key = sessKey(t, curDay);
  const sess = S.log[key] || { sets: {} };
  const last = lastSession(curDay, t);

  let h = `<div class="card habits">
    <div class="row"><button class="check ${sess.steps?"on":""}" data-habit="steps">${sess.steps?"✓":""}</button><div>${ph.steps} pasos</div></div>
    ${day.cardio ? `<div class="row"><button class="check ${sess.cardio?"on":""}" data-habit="cardio">${sess.cardio?"✓":""}</button><div>Cardio: ${day.cardio}</div></div>` : ""}
  </div>`;

  day.ex.forEach((e, ei) => {
    const [name, sets, reps, type] = e;
    const isTime = type === "time";
    const cur = sess.sets[ei] || [];
    const prev = last?.s.sets?.[ei] || [];
    const rest = suggestedRest(reps);
    const allDone = cur.length >= sets && cur.slice(0, sets).every(x => x?.done);
    let lastTxt = "";
    if (prev.some(x => x && (x.kg || x.reps))) {
      lastTxt = prev.map(x => isTime ? `${x.reps||"–"}s` : `${x.kg||"–"}×${x.reps||"–"}`).join(" · ");
      const top = parseInt(String(reps).split("-")[1], 10);
      const hitTop = !isTime && top && prev.length >= sets && prev.slice(0, sets).every(x => +x.reps >= top);
      lastTxt = `Última vez (${fmtDate(last.date)}): ${lastTxt}${hitTop ? '<span class="badge">↑ sube peso</span>' : ""}`;
    }
    h += `<div class="card ex ${allDone?"done-ex":""}">
      <h3>${name}</h3>
      <div class="meta">${sets} × ${reps}${isTime?"":" reps"} · descanso ${Math.floor(rest/60)}:${String(rest%60).padStart(2,"0")}</div>
      ${lastTxt ? `<div class="last">${lastTxt}</div>` : ""}
      <div class="sets">`;
    for (let si = 0; si < sets; si++) {
      const c = cur[si] || {}, pv = prev[si] || {};
      h += `<div class="set">
        <div class="n">S${si+1}</div>
        ${isTime ? `<div></div>` : `<div class="unit"><input inputmode="decimal" data-ex="${ei}" data-set="${si}" data-f="kg" value="${c.kg??""}" placeholder="${pv.kg??""}"><span>kg</span></div>`}
        <div class="unit"><input inputmode="numeric" data-ex="${ei}" data-set="${si}" data-f="reps" value="${c.reps??""}" placeholder="${pv.reps??""}"><span>${isTime?"seg":"reps"}</span></div>
        <button class="check ${c.done?"on":""}" data-ex="${ei}" data-set="${si}" data-rest="${rest}" aria-label="Serie hecha">${c.done?"✓":""}</button>
      </div>`;
    }
    const note = S.notes[name] || "";
    h += `</div><div class="note"><input data-note="${name.replace(/"/g,"&quot;")}" value="${note.replace(/"/g,"&quot;")}" placeholder="Nota (máquina, ajuste de asiento…)"></div></div>`;
  });

  h += `<button class="finish ${sess.finished?"done":""}" id="finish">${sess.finished ? "✓ Entrenamiento terminado" : "Terminar entrenamiento"}</button>`;
  $("#day").innerHTML = h;
}

function getSess() {
  const k = sessKey(today(), curDay);
  if (!S.log[k]) S.log[k] = { sets: {} };
  return S.log[k];
}
function getSet(ei, si) {
  const s = getSess();
  if (!s.sets[ei]) s.sets[ei] = [];
  if (!s.sets[ei][si]) s.sets[ei][si] = {};
  return s.sets[ei][si];
}

document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.f) { getSet(t.dataset.ex, t.dataset.set)[t.dataset.f] = t.value.replace(",", "."); save(); }
  if (t.dataset.note !== undefined) { S.notes[t.dataset.note] = t.value; save(); }
});

document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.d !== undefined) { curDay = +b.dataset.d; render(); window.scrollTo(0, 0); return; }
  if (b.dataset.habit) { const s = getSess(); s[b.dataset.habit] = !s[b.dataset.habit]; save(); render(); return; }
  if (b.dataset.set !== undefined && b.classList.contains("check")) {
    const card = b.closest(".set");
    const st = getSet(b.dataset.ex, b.dataset.set);
    // Si está vacío, usa los valores de la vez pasada
    card.querySelectorAll("input").forEach(inp => { if (!inp.value && inp.placeholder) st[inp.dataset.f] = inp.placeholder; });
    st.done = !st.done; save();
    if (st.done) startTimer(+b.dataset.rest);
    const y = window.scrollY; render(); window.scrollTo(0, y);
    return;
  }
  if (b.id === "finish") { const s = getSess(); s.finished = !s.finished; save(); render(); return; }
  if (b.dataset.add) { startTimer(+b.dataset.add); return; }
  if (b.id === "tStop") { endAt = 0; tick(); return; }
  if (b.id === "wkMinus" || b.id === "wkPlus") {
    const w = Math.min(P().weeks, Math.max(1, week() + (b.id === "wkPlus" ? 1 : -1)));
    S.week[S.program] = w; save(); curDay = null; render(); return;
  }
  if (b.id === "menuBtn") { openMenu(); return; }
});

// ---------- Temporizador de descanso ----------
let endAt = 0, audioCtx = null, beeped = true;
function startTimer(sec) {
  endAt = Date.now() + sec * 1000; beeped = false;
  try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); audioCtx.resume(); } catch (e) {}
  tick();
}
function beep() {
  if (!audioCtx) return;
  [0, 0.25, 0.5].forEach(d => {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.frequency.value = 880; o.connect(g); g.connect(audioCtx.destination);
    g.gain.setValueAtTime(0.25, audioCtx.currentTime + d); g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + d + 0.18);
    o.start(audioCtx.currentTime + d); o.stop(audioCtx.currentTime + d + 0.2);
  });
}
function tick() {
  const left = Math.max(0, Math.ceil((endAt - Date.now()) / 1000));
  const el = $("#tVal");
  el.textContent = `${Math.floor(left/60)}:${String(left%60).padStart(2,"0")}`;
  el.classList.toggle("zero", endAt && left === 0);
  if (endAt && left === 0 && !beeped) { beeped = true; beep(); }
}
setInterval(tick, 250);

// ---------- Menú ----------
function openMenu() {
  const opts = Object.entries(PROGRAMS).map(([k, p]) => `<option value="${k}" ${k===S.program?"selected":""}>${p.name} — ${p.focus} (${p.weeks} sem)</option>`).join("");
  $("#panel").innerHTML = `<h2>Menú</h2>
    <p class="muted" style="margin:0 0 6px">Programa</p>
    <select id="progSel">${opts}</select>
    <div style="height:14px"></div>
    <button class="btn" id="mHist">📅 Historial</button>
    <button class="btn" id="mExport">💾 Guardar respaldo</button>
    <button class="btn" id="mImport">📥 Restaurar respaldo</button>
    <input type="file" id="fileIn" accept=".json,application/json" style="display:none">
    <button class="btn" id="mClose">Cerrar</button>
    <p class="muted">Tus datos se guardan solo en este iPhone. Haz un respaldo de vez en cuando y guárdalo en Archivos o iCloud.</p>`;
  $("#sheet").classList.add("on");
  $("#progSel").onchange = ev => { S.program = ev.target.value; save(); curDay = null; render(); closeMenu(); };
  $("#mHist").onclick = showHistory;
  $("#mExport").onclick = exportData;
  $("#mImport").onclick = () => $("#fileIn").click();
  $("#fileIn").onchange = importData;
  $("#mClose").onclick = closeMenu;
}
function closeMenu() { $("#sheet").classList.remove("on"); }
$("#sheet").addEventListener("click", e => { if (e.target.id === "sheet") closeMenu(); });

function showHistory() {
  const items = Object.entries(S.log).filter(([, s]) => s.finished).sort((a, b) => b[0].localeCompare(a[0]));
  let h = `<h2>Historial</h2>`;
  if (!items.length) h += `<p class="muted">Aún no hay entrenamientos terminados.</p>`;
  for (const [k, s] of items.slice(0, 60)) {
    const [date, prog, ph, d] = k.split("|");
    const pr = PROGRAMS[prog]; const day = pr?.phases[ph]?.days[d];
    if (!day) continue;
    const lines = day.ex.map((e, ei) => {
      const arr = (s.sets[ei] || []).filter(x => x && (x.kg || x.reps));
      if (!arr.length) return "";
      return `<div class="muted">${e[0]}: ${arr.map(x => e[3]==="time" ? `${x.reps}s` : `${x.kg||"–"}×${x.reps||"–"}`).join(", ")}</div>`;
    }).join("");
    h += `<div class="hist-item"><b>${fmtDate(date)} · ${pr.name} ${pr.phases[ph].label} · ${day.subtitle} ${day.title}</b>${lines}</div>`;
  }
  h += `<button class="btn" id="hBack">← Volver</button>`;
  $("#panel").innerHTML = h;
  $("#hBack").onclick = openMenu;
}

async function exportData() {
  const blob = new Blob([JSON.stringify(S)], { type: "application/json" });
  const name = `migym-respaldo-${today()}.json`;
  const file = new File([blob], name, { type: "application/json" });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: name }); return; } catch (e) { if (e.name === "AbortError") return; }
  }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click();
}
function importData(ev) {
  const f = ev.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try { const d = JSON.parse(r.result); if (!d.log) throw 0; S = d; save(); curDay = null; render(); closeMenu(); alert("Respaldo restaurado ✓"); }
    catch (e) { alert("Ese archivo no es un respaldo válido."); }
  };
  r.readAsText(f);
}

render();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
